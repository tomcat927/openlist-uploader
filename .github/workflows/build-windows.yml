name: Build Windows

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}-${{ hashFiles('src-tauri/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}-

      - name: Install frontend dependencies
        run: npm ci

      - name: Set version from China time
        shell: pwsh
        run: |
          $chinaTime = (Get-Date).ToUniversalTime().AddHours(8)
          $newVersion = "{0}.{1}.{2}" -f $chinaTime.Year, ($chinaTime.Month * 100 + $chinaTime.Day), ($chinaTime.Hour * 100 + $chinaTime.Minute)
          echo "China time: $chinaTime"
          echo "Setting version to $newVersion"
          (Get-Content src-tauri/Cargo.toml) -replace '^version = ".*"', "version = `"$newVersion`"" | Set-Content src-tauri/Cargo.toml
          (Get-Content src-tauri/tauri.conf.json) -replace '"version": ".*"', "`"version`": `"$newVersion`"" | Set-Content src-tauri/tauri.conf.json
          echo "Updated Cargo.toml:"
          Select-String -Path src-tauri/Cargo.toml -Pattern "^version"
          echo "Updated tauri.conf.json:"
          Select-String -Path src-tauri/tauri.conf.json -Pattern '"version"'
          Add-Content -Path $env:GITHUB_ENV -Value "APP_VERSION=$newVersion"


      - name: Clean stale local bundle output
        shell: pwsh
        run: |
          if (Test-Path "src-tauri\target\release\bundle") {
            Remove-Item -LiteralPath "src-tauri\target\release\bundle" -Recurse -Force
            Write-Host "Cleaned stale bundle output"
          }

      - name: Restore Windows optional native packages
        run: npm install @rollup/rollup-win32-x64-msvc @tauri-apps/cli-win32-x64-msvc --no-save --include=optional

      - name: Clean old release assets
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          try {
            $assets = gh release view latest --repo $env:GITHUB_REPOSITORY --json assets -q '.assets[].name' 2>$null | ForEach-Object { $_.Trim() }
            if (-not $assets) {
              Write-Host "No existing release, skipping cleanup"
              exit 0
            }
            $toDelete = $assets | Where-Object { $_ -like '*.exe' -or $_ -like '*.exe.sig' }
            foreach ($name in $toDelete) {
              Write-Host "Deleting $name"
              gh release delete-asset latest $name --repo $env:GITHUB_REPOSITORY --yes
            }
          } catch {
            Write-Host "No existing release to clean, skipping"
          }

      - name: Build Tauri App for Windows
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          npm run tauri build
          Write-Host "Build finished"

      - name: Upload to release
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $release = "latest"
          $repo = $env:GITHUB_REPOSITORY
          $version = $env:APP_VERSION

          # 查找 release 目录下的构建产物
          $bundleDir = "src-tauri\target\release\bundle"
          $artifacts = @()
          if (Test-Path "$bundleDir\nsis") {
            Get-ChildItem "$bundleDir\nsis\*" -ErrorAction SilentlyContinue | Where-Object { $_.Name -like "*$version*" -and ($_.Name -like '*.exe' -or $_.Name -like '*.exe.sig' -or $_.Name -like '*.zip' -or $_.Name -like '*.zip.sig') } | ForEach-Object { $artifacts += $_.FullName }
          }
          if (Test-Path "$bundleDir\msi") {
            Get-ChildItem "$bundleDir\msi\*" -ErrorAction SilentlyContinue | Where-Object { $_.Name -like "*$version*" -and ($_.Name -like '*.msi' -or $_.Name -like '*.msi.sig' -or $_.Name -like '*.zip' -or $_.Name -like '*.zip.sig') } | ForEach-Object { $artifacts += $_.FullName }
          }
          # 查找 latest.json
          $latestJsonPath = "src-tauri\target\release\latest.json"
          if (Test-Path $latestJsonPath) {
            $artifacts += $latestJsonPath
            Write-Host "Found latest.json at $latestJsonPath"
          }

          Write-Host "Found artifacts:"
          $artifacts | ForEach-Object { Write-Host "  $_" }

          # 检查 release 是否存在，存在则上传，否则创建
          $releaseExists = $false
          try {
            $null = gh release view $release --repo $repo 2>$null
            $releaseExists = $true
          } catch {
            $releaseExists = $false
          }

          if (-not $releaseExists) {
            Write-Host "Release '$release' does not exist, creating..."
            gh release create $release --title "最新构建" --notes "每次 push 自动构建的最新版本。安装后打开软件，在设置页配置 Alist 账号信息即可使用。" --repo $repo --latest
          }

          # 上传所有产物
          foreach ($artifact in $artifacts) {
            Write-Host "Uploading $artifact"
            gh release upload $release $artifact --repo $repo --clobber
          }

      - name: Patch latest.json
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = $env:APP_VERSION
          $repo = $env:GITHUB_REPOSITORY
          # exe name pattern: openlist-uploader_{version}_x64-setup.exe
          $exeName = "openlist-uploader_${version}_x64-setup.exe"
          $sigName = "${exeName}.sig"
          $pubDate = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ss.fffZ")
          $notes = "每次 push 自动构建的最新版本。"

          # Download the .sig file from the release to get the signature
          $sigLocal = "openlist-uploader.sig"
          gh release download latest --pattern $sigName --repo $repo --clobber 2>$null
          if (-not (Test-Path $sigName)) {
            Write-Host "ERROR: signature file $sigName not found in release"
            exit 1
          }
          $signature = (Get-Content $sigName -Raw).Trim()

          # Build the update manifest JSON
          $baseUrl = "https://github.com/$repo/releases/download/latest"
          $proxyUrl = "https://gh-proxy.org/$baseUrl"
          $json = @{
            version = $version
            notes = $notes
            pub_date = $pubDate
            platforms = @{
              "windows-x86_64" = @{
                signature = $signature
                url = "$proxyUrl/$exeName"
              }
              "windows-x86_64-nsis" = @{
                signature = $signature
                url = "$proxyUrl/$exeName"
              }
            }
          } | ConvertTo-Json -Compress
          Set-Content -Path latest.json -Value $json -NoNewline
          Write-Host "Uploading latest.json (version $version)"
          gh release upload latest latest.json --repo $repo --clobber
