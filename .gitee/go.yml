version: '1.0'

name: openlist-uploader-build

trigger:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  
  # 手动触发
  manual:

stages:
  - name: build-windows
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: https://gitee.com/actions/checkout@v4

      - name: 设置 Node.js
        uses: https://gitee.com/actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 安装 Rust
        uses: https://gitee.com/dtolnay/rust-toolchain@stable

      - name: 安装前端依赖
        run: npm ci

      - name: 构建前端
        run: npm run build

      - name: 构建 Tauri 应用
        run: npm run tauri build
        env:
          CI: true

      - name: 上传产物
        uses: https://gitee.com/actions/upload-artifact@v4
        with:
          name: openlist-uploader-windows-${{ github.sha }}
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 30

  - name: build-linux
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: https://gitee.com/actions/checkout@v4

      - name: 设置 Node.js
        uses: https://gitee.com/actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 安装 Rust
        uses: https://gitee.com/dtolnay/rust-toolchain@stable

      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev

      - name: 安装前端依赖
        run: npm ci

      - name: 构建前端
        run: npm run build

      - name: 构建 Tauri 应用
        run: npm run tauri build
        env:
          CI: true

      - name: 上传产物
        uses: https://gitee.com/actions/upload-artifact@v4
        with:
          name: openlist-uploader-linux-${{ github.sha }}
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
          retention-days: 30

  - name: build-macos
    runs-on: macos-latest
    steps:
      - name: 检出代码
        uses: https://gitee.com/actions/checkout@v4

      - name: 设置 Node.js
        uses: https://gitee.com/actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 安装 Rust
        uses: https://gitee.com/dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: 安装前端依赖
        run: npm ci

      - name: 构建前端
        run: npm run build

      - name: 构建 Tauri 应用
        run: npm run tauri build
        env:
          CI: true

      - name: 上传产物
        uses: https://gitee.com/actions/upload-artifact@v4
        with:
          name: openlist-uploader-macos-${{ github.sha }}
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app
          retention-days: 30
